<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Work - Bellucci Even</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ── RESET & TOKENS ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:        #14203C;
  --ink-soft:   #2B3A5C;
  --paper:      #FBFAF8;
  --amber:      #E8A33D;
  --teal:       #2FBF9F;
  --slate:      #6B7A8F;
  --night:      #0C1220;
  --night-soft: #16213A;
  --line:       rgba(20,32,60,0.12);
  --ff-display: 'Fraunces', serif;
  --ff-body:    'Inter', sans-serif;
  --ff-mono:    'IBM Plex Mono', monospace;
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--ff-body);
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  height: 100vh; width: 100vw;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: var(--ff-display); font-weight: 600; letter-spacing: -0.01em; }
button { font-family: var(--ff-body); cursor: pointer; border: none; background: none; }
::selection { background: var(--amber); color: var(--night); }


/* ── PAGE 1 : LANDING ───────────────────────────────────── */
#page1 {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper);
  transition: transform 1s cubic-bezier(.6,0,.4,1), opacity .9s ease;
}
#page1.zooming { transform: scale(9); opacity: 0; pointer-events: none; }
#page1.hidden   { display: none; }

.p1-index {
  position: absolute; left: 6vw; top: 50%; transform: translateY(-50%);
  font-family: var(--ff-mono); font-size: 0.72rem; color: var(--slate);
  max-width: 230px; line-height: 1.9;
}
.p1-index b {
  display: block; font-family: var(--ff-mono); font-size: 0.68rem;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--teal); margin-bottom: 10px;
}
.p1-index ul { list-style: none; }
.p1-index li { padding: 3px 0; border-left: 2px solid var(--line); padding-left: 10px; }

.p1-center { text-align: center; max-width: 640px; padding: 0 6vw; }
.p1-eyebrow {
  font-family: var(--ff-mono); font-size: 0.78rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 22px;
}
.p1-title { font-size: clamp(2.2rem,5vw,3.6rem); line-height: 1.08; margin-bottom: 22px; }
.p1-title em { font-style: italic; color: var(--teal); }
.p1-sub   { font-size: 1.05rem; color: var(--ink-soft); margin-bottom: 40px; }

.p1-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#enterBtn {
  font-family: var(--ff-mono); font-size: 0.85rem; letter-spacing: 0.04em;
  background: var(--ink); color: var(--paper); border-radius: 40px;
  padding: 18px 44px;
  box-shadow: 0 20px 40px -20px rgba(20,32,60,0.5);
  transition: transform .25s, box-shadow .25s;
}
#enterBtn:hover { transform: translateY(-3px); box-shadow: 0 26px 50px -18px rgba(20,32,60,0.55); }
#enterVademecumBtn {
  font-family: var(--ff-mono); font-size: 0.82rem; letter-spacing: 0.04em;
  color: var(--ink-soft); border: 1px solid var(--line); border-radius: 40px;
  padding: 18px 32px;
  transition: background .2s, color .2s;
}
#enterVademecumBtn:hover { background: var(--ink); color: var(--paper); }

@media (max-width: 900px) { .p1-index { display: none; } }


/* ── PAGE 2 : CANVAS ────────────────────────────────────── */
#viewport {
  position: fixed; inset: 0; z-index: 10; overflow: hidden;
  background: var(--paper); cursor: grab;
  opacity: 0; transform: scale(0.92);
  transition: opacity .9s ease .35s, transform .9s cubic-bezier(.2,.7,.3,1) .35s;
}
#viewport.active   { opacity: 1; transform: scale(1); }
#viewport.grabbing { cursor: grabbing; }

#world {
  position: absolute; top: 0; left: 0;
  width: 10400px; height: 2800px;
  will-change: transform;
}
#pathSvg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
#pathSvg path {
  fill: none; stroke: var(--line); stroke-width: 2;
  stroke-dasharray: 2 14; stroke-linecap: round;
}

/* Cards */
.card {
  position: absolute; width: 650px;
  background: #fff; border: 1px solid var(--line); border-radius: 20px;
  padding: 40px 44px;
  box-shadow: 0 30px 60px -35px rgba(20,32,60,0.3);
}
.card .eyebrow {
  font-family: var(--ff-mono); font-size: 0.68rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--teal); margin-bottom: 12px;
}
.card .c-title  { font-size: 1.5rem; margin-bottom: 18px; outline: none; }
.card .c-body   { font-size: 0.95rem; color: var(--ink-soft); outline: none; }
.card .c-body p    { margin-bottom: 14px; }
.card .c-body h4   { font-size: 1rem; color: var(--ink); margin: 18px 0 8px; }
.card .c-body ul   { padding-left: 20px; margin-bottom: 14px; }
.card .c-body li   { margin-bottom: 8px; }
.card .c-body em   { color: var(--teal); font-style: normal; font-weight: 600; }
.card .c-body strong { color: var(--ink); }

/* Edit highlight */
.card[data-editing="true"] .c-title,
.card[data-editing="true"] .c-body {
  background: rgba(47,191,159,0.06); border-radius: 10px;
  padding: 6px 10px; margin: -6px -10px 8px;
}

/* Image slot inside cards */
.card-img-wrap   { margin-bottom: 18px; }
.card-img-wrap img { width: 100%; border-radius: 12px; display: block; }
.card-img-add {
  display: none; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px;
  margin-bottom: 18px;
  font-family: var(--ff-mono); font-size: 0.75rem; color: var(--slate);
  background: #FAFAF9; cursor: pointer;
}
.card[data-editing="true"] .card-img-add { display: flex; }
.card-img-remove {
  display: none; font-family: var(--ff-mono); font-size: 0.68rem;
  color: #B5482E; margin-bottom: 14px; padding: 0;
}
.card[data-editing="true"] .card-img-remove.has { display: inline-block; }

/* Code & scraping animations */
.code-anim pre {
  background: var(--night); color: var(--teal);
  font-family: var(--ff-mono); font-size: 0.78rem;
  border-radius: 14px; padding: 22px; overflow-x: auto; line-height: 1.7;
}
.code-anim .kw  { color: var(--amber); }
.code-anim pre code .line {
  display: block; opacity: 0; transform: translateX(-8px);
  animation: lineIn .4s ease forwards;
}
@keyframes lineIn { to { opacity: 1; transform: none; } }

.scrape-anim {
  height: 110px; position: relative; border-radius: 14px;
  background: #F1EEEA; overflow: hidden; margin-bottom: 18px;
  border: 1px solid var(--line);
}
.scrape-anim::before { content: '🌐'; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 1.6rem; }
.scrape-anim::after  {
  content: '📄 CSV'; position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
  font-family: var(--ff-mono); font-size: 0.72rem; color: var(--slate);
  background: #fff; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
}
.scrape-row {
  position: absolute; left: 60px; width: 26px; height: 6px;
  background: var(--teal); border-radius: 3px; opacity: 0.85;
  animation: scrapeMove 2.6s linear infinite;
}
.scrape-row:nth-child(1) { top: 30%; animation-delay: 0s; }
.scrape-row:nth-child(2) { top: 50%; animation-delay: .6s; }
.scrape-row:nth-child(3) { top: 70%; animation-delay: 1.2s; }
.scrape-row:nth-child(4) { top: 40%; animation-delay: 1.8s; }
@keyframes scrapeMove {
  0%   { left: 60px; opacity: 0; }
  10%  { opacity: .9; }
  85%  { opacity: .9; }
  100% { left: calc(100% - 100px); opacity: 0; }
}

/* Chatbot mini flow */
.flow-mini { display: flex; gap: 14px; overflow-x: auto; padding: 6px 0 12px; }
.flow-mini-node { flex: 0 0 130px; background: var(--night); color: var(--paper); border-radius: 12px; padding: 14px 12px; }
.flow-mini-node span { font-family: var(--ff-mono); font-size: 0.6rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }
.flow-mini-node b    { font-weight: 600; font-size: 0.8rem; }


/* ── PAGE 3 : VADEMECUM ─────────────────────────────────── */
#vademecum {
  position: fixed; inset: 0; z-index: 45;
  background: var(--night);
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform .7s cubic-bezier(.4,0,.2,1);
}
#vademecum.open { transform: translateX(0); }

.vd-header {
  position: sticky; top: 0; z-index: 5;
  background: rgba(12,18,32,0.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  padding: 20px 6vw;
  display: flex; align-items: center; justify-content: space-between;
}
.vd-header-left { display: flex; align-items: center; gap: 20px; }
.vd-back {
  font-family: var(--ff-mono); font-size: 0.78rem; color: rgba(251,250,248,0.6);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; padding: 10px 20px;
  transition: all .2s;
}
.vd-back:hover { background: rgba(255,255,255,0.08); color: var(--paper); }
.vd-title { font-family: var(--ff-display); font-size: 1.3rem; color: var(--paper); }
.vd-subtitle { font-family: var(--ff-mono); font-size: 0.7rem; color: var(--teal); letter-spacing: 0.08em; }

.vd-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  padding: 40px 6vw 80px;
  align-items: start;
}
@media (max-width: 900px) { .vd-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 580px) { .vd-grid { grid-template-columns: 1fr; } }

.vd-card {
  background: var(--night-soft);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px; overflow: hidden;
  position: relative;
}
.vd-card-img {
  width: 100%; display: block;
  aspect-ratio: 3/4; object-fit: cover;
  background: rgba(255,255,255,0.04);
}
.vd-card-img.empty {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-mono); font-size: 0.72rem; color: var(--slate);
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.vd-card-footer {
  padding: 16px 18px 20px;
}
.vd-card-title {
  font-family: var(--ff-display); font-size: 1rem;
  color: var(--paper); outline: none;
  line-height: 1.3;
}
.vd-card[data-editing="true"] .vd-card-title {
  background: rgba(47,191,159,0.08); border-radius: 8px;
  padding: 4px 8px; margin: -4px -8px;
}
.vd-card-remove {
  display: none; position: absolute; top: 10px; right: 10px;
  background: rgba(181,72,46,0.85); color: #fff;
  border-radius: 50%; width: 30px; height: 30px;
  font-size: 1rem; line-height: 30px; text-align: center;
  font-weight: 700; cursor: pointer;
}
.vd-card[data-editing="true"] .vd-card-remove { display: block; }
.vd-card-upload-input { display: none; }

/* Add photo button in vademecum edit mode */
.vd-add-btn {
  display: none;
  background: rgba(255,255,255,0.04);
  border: 1.5px dashed rgba(255,255,255,0.15);
  border-radius: 16px; padding: 40px 20px;
  width: 100%;
  font-family: var(--ff-mono); font-size: 0.8rem; color: var(--slate);
  text-align: center; cursor: pointer;
  transition: background .2s, color .2s;
  aspect-ratio: 3/4;
  align-items: center; justify-content: center; flex-direction: column; gap: 10px;
}
.vd-add-btn:hover { background: rgba(255,255,255,0.08); color: var(--paper); }
#vademecum.editing .vd-add-btn { display: flex; }
.vd-add-icon { font-size: 2rem; }


/* ── FLOATING NAV (page 2+3) ────────────────────────────── */
#menuToggle {
  position: fixed; top: 26px; right: 26px; z-index: 48;
  background: var(--ink); color: var(--paper); border-radius: 30px;
  padding: 12px 22px; font-family: var(--ff-mono); font-size: 0.78rem; letter-spacing: 0.04em;
  box-shadow: 0 16px 30px -18px rgba(20,32,60,0.5);
  display: none;
}
#menuToggle.visible { display: block; }

#menuPanel {
  position: fixed; top: 78px; right: 26px; z-index: 48; width: 300px;
  background: rgba(255,255,255,0.97); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 18px; padding: 16px;
  box-shadow: 0 30px 60px -30px rgba(20,32,60,0.35);
  max-height: 70vh; overflow-y: auto;
  transform: translateY(-12px); opacity: 0; pointer-events: none;
  transition: all .25s ease;
}
#menuPanel.open { transform: none; opacity: 1; pointer-events: auto; }
.menu-section-btn {
  display: block; width: 100%; text-align: left;
  font-size: 0.86rem; color: var(--ink-soft); padding: 10px 12px;
  border-radius: 10px; transition: background .2s;
}
.menu-section-btn:hover { background: #F1EEEA; color: var(--ink); }
.menu-divider {
  border: none; border-top: 1px solid var(--line); margin: 8px 0;
}
.menu-vademecum-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  text-align: left; font-size: 0.86rem; color: var(--teal); padding: 10px 12px;
  border-radius: 10px; transition: background .2s; font-weight: 600;
}
.menu-vademecum-btn:hover { background: rgba(47,191,159,0.1); }

#homeBtn {
  position: fixed; top: 26px; left: 26px; z-index: 48;
  background: rgba(255,255,255,0.9); border: 1px solid var(--line);
  border-radius: 30px; padding: 10px 20px;
  font-family: var(--ff-mono); font-size: 0.75rem; color: var(--ink-soft);
  display: none;
}
#homeBtn.visible { display: block; }


/* ── ADMIN LOCK ─────────────────────────────────────────── */
#lockBtn {
  position: fixed; bottom: 26px; right: 26px; z-index: 60;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--night); color: var(--paper); font-size: 1.1rem;
  box-shadow: 0 16px 30px -16px rgba(0,0,0,0.5);
}


/* ── MODALS ─────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(12,18,32,0.55); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 20px; padding: 36px; width: 340px;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,0.4);
}
.modal h3  { font-size: 1.15rem; margin-bottom: 6px; }
.modal .hint { font-family: var(--ff-mono); font-size: 0.72rem; color: var(--slate); margin-bottom: 20px; line-height: 1.6; }
.modal label { font-family: var(--ff-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); display: block; margin-bottom: 6px; margin-top: 14px; }
.modal input  { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-family: var(--ff-body); font-size: 0.9rem; }
.modal .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.modal .primary { flex: 1; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 12px; font-size: 0.85rem; font-weight: 600; }
.modal .ghost   { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 0.85rem; color: var(--slate); }
.modal .err     { color: #B5482E; font-size: 0.78rem; font-family: var(--ff-mono); margin-top: 10px; display: none; }


/* ── EDIT TOOLBAR ───────────────────────────────────────── */
#editBar {
  position: fixed; bottom: 26px; left: 50%; z-index: 60;
  transform: translateX(-50%) translateY(120%);
  background: var(--night); color: var(--paper); border-radius: 40px;
  padding: 12px 12px 12px 22px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 20px 40px -18px rgba(0,0,0,0.5);
  transition: transform .35s ease;
  font-family: var(--ff-mono); font-size: 0.78rem;
  white-space: nowrap;
}
#editBar.open { transform: translateX(-50%) translateY(0); }
.edit-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); display: inline-block; margin-right: 4px; }
#saveGhBtn   { background: var(--teal); color: var(--night); border-radius: 30px; padding: 10px 20px; font-weight: 700; font-family: var(--ff-mono); font-size: 0.78rem; }
#configGhBtn, #exitEditBtn { border: 1px solid rgba(251,250,248,0.25); color: var(--paper); border-radius: 30px; padding: 10px 16px; font-family: var(--ff-mono); font-size: 0.72rem; }


/* ── TOAST ──────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 96px; left: 50%; z-index: 90;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper);
  padding: 14px 22px; border-radius: 12px;
  font-family: var(--ff-mono); font-size: 0.8rem;
  opacity: 0; pointer-events: none;
  transition: all .3s ease;
  box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  max-width: 340px; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

input[type=file] { display: none; }

</style>
</head>
<body>


<!-- ════════════════════════════════════════════════════════
     PAGE 1 : LANDING
═════════════════════════════════════════════════════════ -->
<div id="page1">
  <div class="p1-index">
    <b>Indice</b>
    <ul id="p1IndexList"></ul>
  </div>
  <div class="p1-center">
    <div class="p1-eyebrow"    id="p1Eyebrow"></div>
    <h1 class="p1-title"      id="p1Title"></h1>
    <p  class="p1-sub"        id="p1Sub"></p>
    <div class="p1-buttons">
      <button id="enterBtn"><span id="p1BtnLabel"></span></button>
      <button id="enterVademecumBtn">📷 Vademecum</button>
    </div>
  </div>
</div>


<!-- ════════════════════════════════════════════════════════
     PAGE 2 : CANVAS
═════════════════════════════════════════════════════════ -->
<div id="viewport">
  <div id="world">
    <svg id="pathSvg"><path id="pathLine" d=""/></svg>
    <!-- cards injected by JS -->
  </div>
</div>


<!-- ════════════════════════════════════════════════════════
     PAGE 3 : VADEMECUM
═════════════════════════════════════════════════════════ -->
<div id="vademecum">
  <div class="vd-header">
    <div class="vd-header-left">
      <button class="vd-back" id="vdBack">← Torna al progetto</button>
      <div>
        <div class="vd-title">Vademecum</div>
        <div class="vd-subtitle">Raccolta fotografica</div>
      </div>
    </div>
  </div>
  <div class="vd-grid" id="vdGrid">
    <!-- photo cards injected by JS -->
    <button class="vd-add-btn" id="vdAddBtn">
      <span class="vd-add-icon">＋</span>
      Aggiungi foto
    </button>
  </div>
</div>


<!-- ════════════════════════════════════════════════════════
     FLOATING NAV
═════════════════════════════════════════════════════════ -->
<button id="homeBtn">← Copertina</button>
<button id="menuToggle">☰ Menù</button>
<div id="menuPanel" role="menu"></div>


<!-- ════════════════════════════════════════════════════════
     ADMIN
═════════════════════════════════════════════════════════ -->
<button id="lockBtn" title="Area riservata">🔒</button>

<!-- Login modal -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal">
    <h3>Area riservata</h3>
    <p class="hint">Accedi per modificare testi e immagini.</p>
    <label>Utente</label><input type="text"     id="loginUser" autocomplete="off">
    <label>Password</label><input type="password" id="loginPass">
    <div class="err" id="loginErr">Credenziali errate.</div>
    <div class="modal-actions">
      <button class="ghost"   id="loginCancel">Annulla</button>
      <button class="primary" id="loginSubmit">Accedi</button>
    </div>
  </div>
</div>

<!-- GitHub config modal -->
<div class="modal-overlay" id="ghOverlay">
  <div class="modal">
    <h3>Collega GitHub</h3>
    <p class="hint">Serve una sola volta per browser. Il token viene usato per salvare le modifiche nel repository.</p>
    <label>Proprietario (owner)</label><input type="text"     id="ghOwner"  placeholder="es. tuousername">
    <label>Nome repository</label>    <input type="text"     id="ghRepo"   placeholder="es. tesina-its">
    <label>Branch</label>              <input type="text"     id="ghBranch" value="main">
    <label>Personal Access Token</label><input type="password" id="ghToken"  placeholder="github_pat_...">
    <div class="err" id="ghErr"></div>
    <div class="modal-actions">
      <button class="ghost"   id="ghCancel">Annulla</button>
      <button class="primary" id="ghSave">Salva e continua</button>
    </div>
  </div>
</div>

<!-- Edit toolbar -->
<div id="editBar">
  <span><span class="edit-dot"></span>Modalità modifica</span>
  <button id="configGhBtn">⚙ GitHub</button>
  <button id="saveGhBtn">💾 Salva</button>

/* ── LOAD DATA ─────────────────────────────────────────── */
async function loadData() {
  try {
    const res = await fetch('./data.json', {cache:'no-store'});

/* ── PAGE 1 ────────────────────────────────────────────── */

/* ── CANVAS CARDS ──────────────────────────────────────── */
function renderCards() {
  const world = document.getElementById('world');
  world.querySelectorAll('.card').forEach(c => c.remove());

  SECTION_ORDER.forEach((id, idx) => {
    const pos = POSITIONS[id];
    const d   = siteData[id] || {title: id, html: '', image: null};
    const card = document.createElement('div');
    card.className  = 'card';
    card.id         = 'card-' + id;
    card.dataset.id = id;

    const hasImg = !!d.image;
    card.innerHTML = `
      <div class="eyebrow">${String(idx+1).padStart(2,'0')}</div>
      <h3 class="c-title" data-id="${id}">${d.title}</h3>
      ${hasImg ? `<div class="card-img-wrap"><img src="${d.image}" alt=""></div>` : '<div class="card-img-wrap" style="display:none"></div>'}
      <button class="card-img-remove${hasImg?' has':''}">✕ Rimuovi immagine</button>
      <div class="card-img-add">📷 Aggiungi immagine</div>
      <input type="file" accept="image/*" class="card-img-input">
      <div class="c-body" data-id="${id}">${d.html}</div>
    `;
    world.appendChild(card);
  });

  // Scraping animation rows
  world.querySelectorAll('.scrape-anim').forEach(el => {
    if (el.dataset.built) return;
    el.dataset.built = '1';
    for (let i = 0; i < 4; i++) {
      const r = document.createElement('div');
      r.className = 'scrape-row';
      el.appendChild(r);
    }
  });

  // Code animation: staggered line reveal
  world.querySelectorAll('.code-anim code').forEach(el => {
    if (el.dataset.built) return;
    el.dataset.built = '1';
    const kw = /\b(CREATE TABLE|PRIMARY KEY|DEFAULT|NOT NULL|CHECK|IN|REFERENCES|ON DELETE|SET NULL|CASCADE)\b/g;
    el.innerHTML = el.textContent.split('\n').map((line, i) =>
      `<span class="line" style="animation-delay:${i*0.09}s">${line.replace(kw, m => `<span class="kw">${m}</span>`)}</span>`
    ).join('\n');
  });

  attachCardEvents();
}

function attachCardEvents() {
  document.querySelectorAll('.card-img-add').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelector('.card-img-input').click();
    });
  });

  document.querySelectorAll('.card-img-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const id = inp.parentElement.dataset.id;
      cardPending[id] = file;
      const reader = new FileReader();
      reader.onload = () => {
        const card = inp.parentElement;
        let wrap = card.querySelector('.card-img-wrap');
        wrap.style.display = '';
        wrap.innerHTML = `<img src="${reader.result}" alt="">`;
        const rm = card.querySelector('.card-img-remove');
        rm.textContent = '✕ Rimuovi immagine';
        rm.classList.add('has');
      };
      reader.readAsDataURL(file);
    });
  });

  document.querySelectorAll('.card-img-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.parentElement;
      const id   = card.dataset.id;
      const wrap = card.querySelector('.card-img-wrap');
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      btn.classList.remove('has');
      cardPending[id] = 'REMOVE';
    });
  });
}

/* ── PATH ──────────────────────────────────────────────── */
function drawPath() {
  const pts = SECTION_ORDER.map(id => {
    const p = POSITIONS[id];
    return [p.x + 325, p.y + 120];
  });
  const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1]).join(' ');
  document.getElementById('pathLine').setAttribute('d', d);
}


/* ── CANVAS NAVIGATION ─────────────────────────────────── */
const viewport = document.getElementById('viewport');
const world    = document.getElementById('world');
let tx = 0, ty = 0, dragging = false, lastX = 0, lastY = 0;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function applyTransform(animated) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  tx = clamp(tx, vw - 10400 - 100, 100);
  ty = clamp(ty, vh - 2800 - 100, 100);
  world.style.transition = animated ? 'transform .8s cubic-bezier(.2,.7,.3,1)' : 'none';
  world.style.transform  = `translate(${tx}px,${ty}px)`;
}

function goTo(id) {
  const p = POSITIONS[id];
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  tx = vw / 2 - (p.x + 325);
  ty = vh / 2 - (p.y + 200);
  applyTransform(true);
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  let dx = e.deltaX, dy = e.deltaY;
  if (e.shiftKey && dx === 0) { dx = dy; dy = 0; }
  tx -= dx; ty -= dy;
  applyTransform(false);
}, {passive: false});

viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.card') && editMode) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add('grabbing');
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform(false);
});
window.addEventListener('pointerup', () => { dragging = false; viewport.classList.remove('grabbing'); });
window.addEventListener('resize', () => applyTransform(false));

    `;
  } else {
    card.innerHTML = `
      <div class="vd-card-img empty">📷 Clicca per aggiungere immagine</div>
      <div class="vd-card-footer">
        <div class="vd-card-title" contenteditable="false">${ph.title || ''}</div>
      </div>
      <button class="vd-card-remove" title="Rimuovi">✕</button>
      <input type="file" class="vd-card-upload-input" accept="image/*">
    `;
    // click on empty to upload
    card.querySelector('.vd-card-img.empty').addEventListener('click', () => {
      if (editMode) card.querySelector('.vd-card-upload-input').click();
    });
  }

  card.querySelector('.vd-card-remove').addEventListener('click', () => {
    vdPending[ph.id] = 'REMOVE';
    card.remove();
    siteData.vademecum = (siteData.vademecum||[]).filter(p => p.id !== ph.id);
  });

  card.querySelector('.vd-card-upload-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    vdPending[ph.id] = file;
    const reader = new FileReader();
    reader.onload = () => {
      let imgEl = card.querySelector('.vd-card-img');
      if (imgEl.classList.contains('empty')) {
        const newImg = document.createElement('img');
        newImg.className = 'vd-card-img';
        newImg.src = reader.result;
        imgEl.replaceWith(newImg);
      } else {
        imgEl.src = reader.result;
      }
    };
    reader.readAsDataURL(file);
  });

  return card;
}

// Add photo button
document.getElementById('vdAddBtn').addEventListener('click', () => {
  if (!editMode) return;
  const id = 'vd-' + Date.now();
  const ph = {id, title: '', image: null};
  siteData.vademecum = siteData.vademecum || [];
  siteData.vademecum.push(ph);
  const card = buildVdCard(ph);
  card.dataset.editing = 'true';
  card.querySelector('.vd-card-title').contentEditable = 'true';
  const grid   = document.getElementById('vdGrid');
  const addBtn = document.getElementById('vdAddBtn');
  grid.insertBefore(card, addBtn);
  // auto-trigger upload for new card
  setTimeout(() => card.querySelector('.vd-card-upload-input').click(), 100);
});


/* ── TOAST ─────────────────────────────────────────────── */
let toastTimer;
function toast(msg, ms = 3200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}


/* ── AUTH ──────────────────────────────────────────────── */
document.getElementById('lockBtn').addEventListener('click', () => {
  if (editMode) { toggleEdit(false); return; }
  document.getElementById('loginOverlay').classList.add('open');
});
document.getElementById('loginCancel').addEventListener('click', () =>
  document.getElementById('loginOverlay').classList.remove('open'));

document.getElementById('loginSubmit').addEventListener('click', () => {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (u === 'even' && p === '2005') {
    document.getElementById('loginOverlay').classList.remove('open');
    document.getElementById('loginErr').style.display = 'none';
    if (!getGhConfig()) {
      document.getElementById('ghOverlay').classList.add('open');
    } else {
      toggleEdit(true);
    }
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
});

function getGhConfig() {
  try { return JSON.parse(localStorage.getItem('ghConfig')); } catch(e) { return null; }
}

document.getElementById('configGhBtn').addEventListener('click', () => {
  const cfg = getGhConfig() || {};
  document.getElementById('ghOwner').value  = cfg.owner  || '';
  document.getElementById('ghRepo').value   = cfg.repo   || '';
  document.getElementById('ghBranch').value = cfg.branch || 'main';
  document.getElementById('ghToken').value  = '';
  document.getElementById('ghOverlay').classList.add('open');
});
document.getElementById('ghCancel').addEventListener('click', () =>
  document.getElementById('ghOverlay').classList.remove('open'));

document.getElementById('ghSave').addEventListener('click', () => {
  const owner  = document.getElementById('ghOwner').value.trim();
  const repo   = document.getElementById('ghRepo').value.trim();
  const branch = document.getElementById('ghBranch').value.trim() || 'main';
  const token  = document.getElementById('ghToken').value.trim();
  if (!owner || !repo || !token) {
    document.getElementById('ghErr').textContent = 'Compila tutti i campi.';
    document.getElementById('ghErr').style.display = 'block';
    return;
  }
  localStorage.setItem('ghConfig', JSON.stringify({owner, repo, branch, token}));
  document.getElementById('ghOverlay').classList.remove('open');
  toggleEdit(true);
});


/* ── EDIT MODE ─────────────────────────────────────────── */
function toggleEdit(on) {
  editMode = on;
  document.getElementById('editBar').classList.toggle('open', on);
  document.getElementById('vademecum').classList.toggle('editing', on);

  // Canvas cards
  document.querySelectorAll('.card').forEach(card => {
    card.dataset.editing = on ? 'true' : 'false';
    const title = card.querySelector('.c-title');
    const body  = card.querySelector('.c-body');
    title.contentEditable = on;
    body.contentEditable  = on;
    if (on) title.addEventListener('input', liveMenuUpdate);
    else    title.removeEventListener('input', liveMenuUpdate);
  });

  // Vademecum cards
  document.querySelectorAll('.vd-card').forEach(card => {
    card.dataset.editing = on ? 'true' : 'false';
    card.querySelector('.vd-card-title').contentEditable = on;
  });

  if (!on) { cardPending = {}; vdPending = {}; }
}

document.getElementById('exitEditBtn').addEventListener('click', () => toggleEdit(false));


/* ── GITHUB SAVE ───────────────────────────────────────── */
function b64FromDataUrl(dataUrl) { return dataUrl.split(',')[1]; }
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

async function ghRequest(cfg, path, opts = {}) {
  return fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
}

async function uploadImage(cfg, file, prefix) {
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const ext   = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const fname = `images/${prefix}-${Date.now()}.${ext}`;
  const res   = await ghRequest(cfg, fname, {
    method: 'PUT',
    body: JSON.stringify({
      message: `Upload immagine ${prefix}`,
      content: b64FromDataUrl(dataUrl),
      branch:  cfg.branch
    })
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.message || 'Errore upload immagine');
  return json.content.download_url;
}

document.getElementById('saveGhBtn').addEventListener('click', async () => {
  const cfg = getGhConfig();
  if (!cfg) { document.getElementById('ghOverlay').classList.add('open'); return; }

  const btn = document.getElementById('saveGhBtn');
  btn.disabled = true;
  toast('Salvataggio in corso…', 12000);

  try {
    // 1. Build output data from DOM
    const out = {};

    // Canvas sections
    SECTION_ORDER.forEach(id => {
      const card = document.getElementById('card-' + id);
      const existImg = siteData[id] && siteData[id].image ? siteData[id].image : null;
      out[id] = {
        title: card.querySelector('.c-title').innerText.trim(),
        html:  card.querySelector('.c-body').innerHTML,
        image: existImg
      };
    });

    // Upload card images
    for (const id of Object.keys(cardPending)) {
      const val = cardPending[id];
      if (val === 'REMOVE') { out[id].image = null; continue; }
      out[id].image = await uploadImage(cfg, val, id);
    }

    // Vademecum
    const vdCards = [...document.querySelectorAll('#vdGrid .vd-card')];
    const vdOut = [];
    for (const card of vdCards) {
      const id    = card.dataset.id;
      const title = card.querySelector('.vd-card-title').innerText.trim();
      const existing = (siteData.vademecum||[]).find(p => p.id === id);
      let image = existing ? existing.image : null;

      if (vdPending[id] && vdPending[id] !== 'REMOVE') {
        image = await uploadImage(cfg, vdPending[id], id);
      } else if (vdPending[id] === 'REMOVE') {
        image = null;
      }
      vdOut.push({id, title, image});
    }
    out.vademecum = vdOut;
    out.page1     = siteData.page1 || DEFAULT_DATA.page1;

    // 2. Get current SHA of data.json
    let sha = null;
    const getRes = await ghRequest(cfg, `data.json?ref=${cfg.branch}`);
    if (getRes.ok) { const j = await getRes.json(); sha = j.sha; }

    // 3. Write data.json
    const jsonStr   = JSON.stringify(out, null, 2);
    const putRes    = await ghRequest(cfg, 'data.json', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'Aggiornamento contenuti sito',
        content: utf8ToB64(jsonStr),
        branch:  cfg.branch,
        ...(sha ? {sha} : {})
      })
    });
    const putJson = await putRes.json();
    if (!putRes.ok) throw new Error(putJson.message || 'Errore salvataggio');

    siteData    = out;
    cardPending = {};
    vdPending   = {};
    renderMenu();

    toast('✅ Salvato — aggiornamento online entro un minuto', 4500);
  } catch(err) {
    toast('❌ ' + err.message, 6000);
  } finally {
    btn.disabled = false;
  }
});
